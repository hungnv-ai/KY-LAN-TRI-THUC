<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9A0036" />
    <meta name="description" content="Kỳ Lân Tri Thức – game học tập theo 5 giá trị cốt lõi của VA Schools." />
    <title>Kỳ Lân Tri Thức – VA Schools</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kỳ Lân" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kỳ Lân Tri Thức – VA Schools" />
    <meta property="og:description" content="Học mà chơi cùng Kỳ lân VA: 5 giá trị Nhân Ái · Bản Lĩnh · Tri Thức · Trách Nhiệm · Khai Phóng." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three.js gắn <canvas> vào đây -->
    <div id="canvas-container" aria-hidden="true"></div>

    <!-- HUD: hạng, XP, Xu, chuỗi ngày -->
    <header id="hud" class="hud">
      <button id="rank-card" class="rank-card" type="button" aria-label="Xem bảng hạng">
        <span id="rank-icon" class="rank-icon" aria-hidden="true">🐣</span>
        <span class="rank-info">
          <span id="rank-label" class="rank-label">Tập Sự</span>
          <span class="xp-bar" role="progressbar" aria-label="Tiến độ lên hạng" aria-valuemin="0" aria-valuemax="100">
            <span id="xp-fill" class="xp-fill"></span>
          </span>
          <span id="xp-text" class="xp-text">0 XP</span>
        </span>
      </button>
      <div class="pills">
        <span id="golden-pill" class="pill pill-golden" hidden>⏰ Giờ Vàng x2</span>
        <span class="pill" title="Chuỗi ngày điểm danh"><span aria-hidden="true">🔥</span><span id="streak-value">0</span></span>
        <span class="pill pill-coins" title="Xu"><span aria-hidden="true">🪙</span><span id="coins-value">0</span></span>
        <button id="sound-btn" class="pill pill-btn" type="button" aria-label="Tắt âm thanh">🔊</button>
      </div>
    </header>

    <!-- Khám phá: quãng đường, câu hỏi kế tiếp, số Vùng Đất đã ghé -->
    <div class="explore-bar">
      <button id="distance-pill" class="pill pill-btn explore-pill" type="button" title="Quãng đường đã chạy — bấm xem các mốc" aria-label="Quãng đường đã chạy, bấm xem các mốc quãng đường">
        <span aria-hidden="true">🏃</span><span id="distance-value">0 m</span>
        <span class="explore-next" id="next-question">❓ 100 m</span>
      </button>
      <span class="pill" title="Vùng Đất đã ghé hôm nay"><span aria-hidden="true">🗺️</span><span id="stations-value">0/5</span></span>
      <button id="home-btn" class="pill pill-btn" type="button" aria-label="Về quảng trường" title="Về quảng trường">🏠</button>
      <button id="overview-btn" class="pill pill-btn" type="button" aria-label="Xem toàn cảnh đảo" aria-pressed="false" title="Xem toàn cảnh đảo">🔭</button>
      <a id="admin-link" class="pill pill-btn" href="/admin" title="Trang quản trị" aria-label="Trang quản trị" hidden>⚙️</a>
      <button id="online-pill" class="pill pill-btn pill-online" type="button" title="Ai đang ở cùng đảo" aria-label="Xem ai đang ở cùng đảo" hidden><span aria-hidden="true">👥</span><span id="online-value">1</span></button>
    </div>

    <!-- Gợi ý phím (máy tính) & cần điều khiển (điện thoại) -->
    <div id="key-hint" class="key-hint" hidden>⌨️ Dùng <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> hoặc <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> để chạy · giữ <kbd>Shift</kbd> chạy nhanh</div>
    <div id="joystick" class="joystick" hidden aria-label="Cần điều khiển: kéo để chạy">
      <span id="joystick-knob" class="joystick-knob"></span>
    </div>

    <!-- Bong bóng lời thoại của Kỳ lân -->
    <div id="speech" class="speech" role="status" aria-live="polite" hidden></div>

    <!-- Thanh điều hướng dưới -->
    <nav class="nav" aria-label="Hoạt động">
      <button class="nav-btn" type="button" data-action="checkin" style="--accent: var(--trach-nhiem)">
        <span class="nav-icon" aria-hidden="true">📅</span>
        <span class="nav-label">Hôm nay</span>
        <span id="checkin-dot" class="nav-dot" hidden></span>
      </button>
      <button class="nav-btn nav-btn-main" type="button" data-action="quiz" style="--accent: var(--tri-thuc)">
        <span class="nav-icon" aria-hidden="true">🧠</span>
        <span class="nav-label">Tri Thức</span>
      </button>
      <button class="nav-btn" type="button" data-action="wardrobe" style="--accent: var(--nhan-ai)">
        <span class="nav-icon" aria-hidden="true">👕</span>
        <span class="nav-label">Tủ đồ</span>
      </button>
      <button class="nav-btn" type="button" data-action="ranks" style="--accent: var(--khai-phong)">
        <span class="nav-icon" aria-hidden="true">🏆</span>
        <span class="nav-label">Hạng</span>
      </button>
    </nav>

    <!-- Nút nhanh bên phải: sticker, chụp ảnh, sự kiện… (do ui/quickActions.js dựng) -->
    <div id="quick-actions" class="quick-actions" hidden></div>

    <!-- Bảng trượt (quiz, tủ đồ, hạng) -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-header">
          <h2 id="sheet-title" class="sheet-title"></h2>
          <button class="icon-btn" type="button" data-close aria-label="Đóng">✕</button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </section>
    </div>

    <div id="dialog-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Màn hình loading -->
    <div id="loading-screen" class="loading">
      <div class="loading-logo" aria-hidden="true">VA</div>
      <p>Kỳ lân đang thức dậy… <span id="loading-progress"></span></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
